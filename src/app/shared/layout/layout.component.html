<div class="h-screen overflow-hidden flex bg-slate-100 text-slate-800">

  <!-- BACKDROP SOLO EN MÓVIL Y TABLET -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 bg-black/50 z-30 lg:hidden"
      (click)="closeSidebar()"
      aria-hidden="true"
    ></div>
  }

  <!-- SIDEBAR (drawer en móvil/tablet, fijo en lg+) -->
  <app-sidebar [open]="sidebarOpen()" />

  <!-- COLUMNA PRINCIPAL -->
  <div class="flex-1 min-w-0 flex flex-col h-full overflow-hidden">

    <!-- BARRA MÓVIL/TABLET: hamburger + branding (oculta en lg+) -->
    <header class="lg:hidden shrink-0 z-20 bg-aura-sidebar text-white flex items-center gap-3 px-4 h-14 shadow-md">
      <button
        type="button"
        (click)="toggleSidebar()"
        class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-aura-sidebar-soft transition"
        [attr.aria-expanded]="sidebarOpen()"
        [attr.aria-label]="sidebarOpen() ? 'Cerrar menú' : 'Abrir menú'"
        [title]="sidebarOpen() ? 'Cerrar menú' : 'Abrir menú'"
      >
        <i class="fa-solid fa-bars text-lg"></i>
      </button>
      <div class="flex items-center gap-2">
        <div class="bg-white text-aura-sidebar font-bold rounded-md w-7 h-7 flex items-center justify-center text-sm">H</div>
        <span class="font-bold tracking-wide">AURA</span>
      </div>
    </header>

    <!-- NAVBAR (buscador, notificaciones, fecha, avatar) -->
    <app-navbar class="shrink-0" />

    <!-- Contenido -->
    <main class="flex-1 min-w-0 overflow-y-auto px-4 md:px-6 pt-2 pb-6">
      <router-outlet />
    </main>
  </div>
</div>
