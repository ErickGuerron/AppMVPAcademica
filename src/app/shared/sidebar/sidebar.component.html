<aside
  class="w-60 shrink-0 bg-aura-sidebar flex flex-col justify-between text-white p-5
         fixed inset-y-0 left-0 z-40 overflow-y-auto transition-transform duration-300 ease-in-out
         lg:relative lg:h-screen lg:translate-x-0 lg:transition-none"
  [class.translate-x-0]="open()"
  [class.-translate-x-full]="!open()"
  [attr.aria-hidden]="!open() ? 'true' : null"
>
  <div>
    <!-- Logo -->
    <div class="flex items-center gap-2.5 mb-7">
      <div class="bg-white text-aura-sidebar font-bold text-lg rounded-md w-9 h-9 flex items-center justify-center shrink-0" title="AURA · Portal estudiantil">H</div>
      <h1 class="text-xl font-bold tracking-wide">AURA</h1>
    </div>

    <!-- Navegacion -->
    <div class="mb-6">
      <p class="text-xs font-semibold text-slate-400 mb-3 tracking-wider">NAVEGACION</p>
      <nav class="space-y-1">
        <a
          routerLink="/resumen"
          routerLinkActive="bg-aura-primary text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          title="Inicio: resumen de tu día"
          class="flex items-center gap-3 py-2.5 px-3.5 rounded-lg font-medium text-slate-300 hover:bg-aura-sidebar-soft hover:text-white transition"
        >
          <i class="fa-solid fa-house w-5" aria-hidden="true"></i> Inicio
        </a>
        <a
          routerLink="/horario"
          routerLinkActive="bg-aura-primary text-white"
          title="Horario: tus clases por día de la semana"
          class="flex items-center gap-3 py-2.5 px-3.5 rounded-lg text-slate-300 hover:bg-aura-sidebar-soft hover:text-white transition"
        >
          <i class="fa-regular fa-calendar w-5" aria-hidden="true"></i> Horario
        </a>
        <a
          routerLink="/notas"
          routerLinkActive="bg-aura-primary text-white"
          title="Calificaciones: tus notas del semestre"
          class="flex items-center gap-3 py-2.5 px-3.5 rounded-lg text-slate-300 hover:bg-aura-sidebar-soft hover:text-white transition"
        >
          <i class="fa-solid fa-award w-5" aria-hidden="true"></i> Calificaciones
        </a>
        <button
          type="button"
          disabled
          title="Perfil · disponible próximamente"
          class="w-full flex items-center gap-3 py-2.5 px-3.5 rounded-lg text-slate-300 opacity-70 cursor-not-allowed transition text-left"
        >
          <i class="fa-regular fa-user w-5" aria-hidden="true"></i> Perfil
        </button>
      </nav>
    </div>

    <!-- Cuenta -->
    <div>
      <p class="text-xs font-semibold text-slate-400 mb-3 tracking-wider">CUENTA</p>
      <nav class="space-y-1">
        <button
          type="button"
          disabled
          title="Ajustes · disponible próximamente"
          class="w-full flex items-center gap-3 py-2.5 px-3.5 rounded-lg text-slate-300 opacity-70 cursor-not-allowed transition text-left"
        >
          <i class="fa-solid fa-ellipsis w-5" aria-hidden="true"></i> Ajustes
        </button>
        <button
          type="button"
          (click)="onLogout()"
          title="Cerrar sesión y volver al login"
          class="w-full flex items-center gap-3 py-2.5 px-3.5 rounded-lg text-slate-300 hover:bg-aura-sidebar-soft hover:text-white transition text-left"
        >
          <i class="fa-solid fa-arrow-right-from-bracket w-5" aria-hidden="true"></i> Cerrar sesion
        </button>
      </nav>
    </div>
  </div>

  <!-- Usuario Footer -->
  @if (auth.usuario(); as usuario) {
    <div class="bg-aura-sidebar-soft rounded-xl p-3 flex items-center gap-2.5 mt-4" [title]="usuario.nombre + ' · ' + usuario.correo">
      <div class="bg-aura-primary-light text-aura-sidebar w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm shrink-0">
        {{ usuario.iniciales }}
      </div>
      <div class="min-w-0">
        <p class="font-semibold text-sm truncate">{{ usuario.nombre }}</p>
        <p class="text-xs text-slate-400 capitalize">{{ usuario.rol }}</p>
      </div>
    </div>
  }
</aside>
